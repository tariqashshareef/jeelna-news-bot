name: uptime check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install selenium

      - run: python scripts/uptime_check.py
        env:
          STREAMLIT_APP_URL: https://jeelna-news-bot.streamlit.app
